<div class="add-device-container">

  <div class="form-card">
    <h2>Add New Device</h2>

    <form (ngSubmit)="addDevice()">

      <div class="form-group">
        <label>Device MAC</label>
        <input type="text"
               [(ngModel)]="mac"
               name="mac"
               required>
      </div>

      <div class="form-group">
        <label>Device Name</label>
        <input type="text"
               [(ngModel)]="name"
               name="name"
               required>
      </div>

      <div class="form-group">
        <label>Group</label>
        <select [(ngModel)]="group"
                name="group"
                required>
          <option value="">Select Group</option>
          <option *ngFor="let g of groups" [value]="g">
            {{ g }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Model</label>
        <input type="text"
               [(ngModel)]="model"
               name="model">
      </div>

      <div class="form-group">
        <label>Device ID</label>
        <input type="text"
               [(ngModel)]="id"
               name="id">
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text"
               [(ngModel)]="location"
               name="location">
      </div>

      <div class="button-row">
        <button type="button"
                class="cancel-btn"
                (click)="cancel()">
          Cancel
        </button>

        <button type="submit"
                class="save-btn">
          Save Device
        </button>
      </div>

    </form>
  </div>

</div>
