<div class="add-group-container">

  <div class="form-card">

    <h2>Create Group</h2>

    <form (ngSubmit)="addGroup()" #groupForm="ngForm">

      <div class="form-group">
        <label>Group Name</label>
        <input type="text"
               [(ngModel)]="name"
               name="name"
               required />
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text"
               [(ngModel)]="location"
               name="location"
               required />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="description"
                  name="description"
                  rows="4"
                  required>
        </textarea>
      </div>

      <div class="button-row">

        <button type="button"
                class="cancel-btn"
                (click)="cancel()">
          Cancel
        </button>

        <button type="submit"
                class="save-btn">
          Save Group
        </button>

      </div>

    </form>  <!-- ✅ YOU WERE MISSING THIS -->

  </div>

</div>
